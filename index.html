<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>世界时区看板</title>
<style>
/* ===== 基础 ===== */
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;padding:10px;
  background:
    radial-gradient(760px 360px at 12% -12%, rgba(120,170,255,.13), transparent 62%),
    radial-gradient(680px 320px at 96% -6%, rgba(255,190,110,.07), transparent 62%),
    #070a10;
  color:#e9eff8;
  font-family:"Inter","Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
  display:flex;justify-content:center;
}
.app{width:100%;max-width:1000px}

/* ===== 顶部一行 ===== */
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 2px 8px;min-width:0}
.now{display:flex;align-items:baseline;gap:7px;flex:1 1 auto;min-width:0;overflow:hidden}
.now b{
  font-size:26px;font-weight:700;line-height:1;
  font-variant-numeric:tabular-nums;letter-spacing:-.02em;white-space:nowrap;
}
.now span{
  flex:0 1 auto;min-width:0;
  font-size:11px;color:#8ea0b6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.tools{display:flex;gap:5px;flex:0 0 auto}
.tools button{
  font:inherit;font-size:11px;cursor:pointer;white-space:nowrap;
  padding:5px 9px;border-radius:8px;
  border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.05);color:#9fb0c5;
  transition:.15s;
}
.tools button:hover{color:#e9eff8;border-color:rgba(120,180,255,.4)}
.tools button[aria-pressed="true"]{color:#eaf3ff;border-color:rgba(120,180,255,.5);background:rgba(90,150,255,.18)}

/* ===== 添加栏 ===== */
.addbar{position:relative;display:flex;gap:7px;margin-bottom:8px}
.addbar input{
  flex:1;min-width:0;font:inherit;font-size:12.5px;
  padding:9px 12px;border-radius:10px;
  border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.05);color:inherit;
  outline:none;transition:.15s;
}
.addbar input::placeholder{color:#6e7f94}
.addbar input:focus{border-color:rgba(120,180,255,.5);box-shadow:0 0 0 3px rgba(90,150,255,.12)}
.addbar button{
  flex:0 0 auto;font:inherit;font-size:12.5px;font-weight:600;cursor:pointer;
  padding:9px 15px;border-radius:10px;
  border:1px solid rgba(120,180,255,.38);background:rgba(90,150,255,.17);color:#eaf3ff;
}
.addbar button:hover{filter:brightness(1.15)}

.suggest{
  position:absolute;left:0;right:60px;top:calc(100% + 5px);z-index:40;
  background:#0d131c;border:1px solid rgba(255,255,255,.12);border-radius:10px;
  box-shadow:0 16px 34px rgba(0,0,0,.55);max-height:250px;overflow-y:auto;
}
.sug{
  display:flex;align-items:center;gap:8px;width:100%;text-align:left;cursor:pointer;
  font:inherit;font-size:12.5px;padding:8px 11px;
  background:transparent;border:0;border-bottom:1px solid rgba(255,255,255,.07);color:inherit;
}
.sug:last-child{border-bottom:0}
.sug:hover,.sug:focus-visible{background:rgba(255,255,255,.07);outline:none}
.sug .n{font-weight:600;white-space:nowrap}
.sug .m{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#8294aa;font-size:11px}
.sug .o{color:#7fb0ff;font-size:11px;font-variant-numeric:tabular-nums;white-space:nowrap}

/* ===== 白天 / 夜间 分区 ===== */
.zone{border-radius:12px;padding:7px 7px 8px;margin-bottom:8px;border:1px solid}
.zone.day{background:linear-gradient(180deg,rgba(255,197,110,.10),rgba(255,197,110,.025));border-color:rgba(255,197,110,.26)}
.zone.night{background:linear-gradient(180deg,rgba(80,132,255,.11),rgba(80,132,255,.025));border-color:rgba(80,132,255,.24)}
.zone-head{display:flex;align-items:center;gap:6px;padding:1px 3px 7px;font-size:11.5px;color:#93a5ba}
.zone-head .name{font-size:12px;font-weight:700;letter-spacing:.02em}
.zone.day .zone-head .name{color:#f3bd5e}
.zone.night .zone-head .name{color:#9dbcff}
.zone-head .hours{opacity:.62;font-variant-numeric:tabular-nums}
.zone-head .count{margin-left:auto;opacity:.55;font-variant-numeric:tabular-nums}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:6px}

/* ===== 卡片：国家在前，与城市同字号 ===== */
.card{
  position:relative;min-width:0;
  padding:6px 9px 5px 11px;border-radius:9px;
  background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.08);
  transition:.15s;
}
.zone.night .card{background:rgba(14,22,40,.55);border-color:rgba(120,160,255,.14)}
.zone.day .card{background:rgba(255,255,255,.07);border-color:rgba(255,210,150,.15)}
.card:hover{background:rgba(255,255,255,.10)}
.card.me{border-color:rgba(255,207,92,.5);background:rgba(255,207,92,.11)}

.place{display:flex;align-items:baseline;gap:5px;font-size:13.5px;line-height:1.3;white-space:nowrap;overflow:hidden;padding-right:14px}
.place .country{color:#93a6bd;font-weight:600;flex:0 0 auto}
.place .city{color:#f1f6fd;font-weight:650;overflow:hidden;text-overflow:ellipsis}

.row{display:flex;align-items:flex-end;justify-content:space-between;gap:4px;margin-top:1px}
.time{
  font-size:20px;font-weight:700;line-height:1.15;letter-spacing:-.02em;
  font-variant-numeric:tabular-nums;font-feature-settings:"tnum";white-space:nowrap;
}
.time .sec{font-size:.56em;font-weight:500;color:#8b9eb5}
.time .ampm{font-size:.44em;font-weight:600;color:#8b9eb5;margin-left:2px;letter-spacing:.03em}
.date{font-size:10px;color:#77899e;white-space:nowrap;font-variant-numeric:tabular-nums;padding-bottom:2px}
.tag{font-size:10px;margin-right:2px}
.date.shift{color:#ffce6b;font-weight:600}

.x{
  position:absolute;top:1px;right:1px;width:16px;height:16px;padding:0;
  line-height:14px;font-size:12px;cursor:pointer;
  border:1px solid transparent;border-radius:5px;background:transparent;color:#93a5ba;
  opacity:.32;transition:.15s;
}
.x:hover{opacity:1;color:#ff8d8d;border-color:rgba(255,122,122,.45);background:rgba(255,122,122,.1)}

/* 工作状态竖条 */
.st{position:absolute;left:0;top:0;bottom:0;width:3px;border-radius:9px 0 0 9px;background:rgba(255,255,255,.10)}
.st.on{background:#3ecf85}
.st.off{background:#5d6d82}
.st.rest{background:#b08a4a}

/* 顶部提醒条 */
.banner{
  display:flex;align-items:center;gap:6px;margin-bottom:8px;padding:6px 9px;
  border-radius:9px;font-size:11.5px;line-height:1.35;
  background:rgba(180,120,255,.10);border:1px solid rgba(180,120,255,.30);color:#d8c9f8;
  overflow-x:auto;white-space:nowrap
}
.banner b{color:#c9a8ff}
.banner[hidden]{display:none}
.banner .dot{color:#7f90a6}

.empty{
  border:1px dashed rgba(255,255,255,.14);border-radius:12px;padding:24px 16px;
  text-align:center;color:#8294aa;font-size:12.5px;line-height:1.7;
}

/* ===== 提示 ===== */
.toast{
  position:fixed;left:50%;bottom:16px;transform:translate(-50%,10px);
  padding:7px 14px;border-radius:999px;font-size:12px;
  background:rgba(16,24,36,.92);border:1px solid rgba(120,180,255,.35);color:#dce9fa;
  opacity:0;pointer-events:none;transition:.2s;z-index:50;white-space:nowrap;
}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:420px){
  body{padding:8px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:5px}
  .now b{font-size:23px}
  .now span{font-size:10px}
  .tools button{padding:4px 7px;font-size:10px}
  .card{padding:6px 8px 5px}
  .time{font-size:19px}
  .place{font-size:13px}
}
@media (min-width:860px){
  .grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="now"><b id="nowTime">--:--</b><span id="nowMeta"></span></div>
    <div class="tools">
      <button id="btnHour" type="button">24 时制</button>
      <button id="btnSec" type="button">秒</button>
      <button id="btnShare" type="button">分享</button>
    </div>
  </div>

  <div class="addbar">
    <input id="q" type="text" autocomplete="off" spellcheck="false" enterkeyhint="done"
           placeholder="城市 / 国家 / 时区，如 纽约、马尔代夫、Asia/Tokyo">
    <button id="addBtn" type="button">添加</button>
    <div class="suggest" id="suggest" hidden></div>
  </div>

  <div class="banner" id="banner" hidden></div>

  <div id="board"></div>
  <div class="toast" id="toast" aria-live="polite"></div>
</div>

  const noon = 12 - eot / 60 + (tzOff - lon / 15);
  const arc = alt => {
    const c = (Math.sin(alt * RAD) - Math.sin(lat * RAD) * Math.sin(decl * RAD)) /
              (Math.cos(lat * RAD) * Math.cos(decl * RAD));
    return (c < -1 || c > 1) ? null : Math.acos(c) / RAD / 15;
  };
  const hSun = arc(-0.833), hFajr = arc(-18);
  const hAsr = arc(Math.atan(1 / (1 + Math.tan(Math.abs(lat - decl) * RAD))) / RAD);
  return {
    noon, decl,
    sunrise: hSun == null ? null : noon - hSun,
    sunset:  hSun == null ? null : noon + hSun,
    fajr:    hFajr == null ? null : noon - hFajr,
    asr:     hAsr == null ? null : noon + hAsr,
    isha:    hSun == null ? null : noon + hSun + 1.5
  };
}

function workStateOf(country, hour, weekday){
  const w = WORK[country] || WORK_DEF;
  if (w.we.indexOf(weekday) > -1) return { k: 'rest', t: '休息日' };
  if (hour >= w.start && hour < w.end)
    return { k: 'on', t: '工作中 ' + pad2(w.start) + ':00–' + pad2(w.end) + ':00' };
  return { k: 'off', t: hour < w.start ? '还没上班' : '已下班' };
}
function prayerAt(country, solar, hour){
  if (!PRAYER.has(country) || !solar) return null;
  const list = [['晨礼', solar.fajr], ['晌礼', solar.noon], ['晡礼', solar.asr],
                ['昏礼', solar.sunset], ['宵礼', solar.isha]];
  for (const [n, t] of list){
    if (t == null) continue;
    if (hour >= t - 0.34 && hour <= t + 0.42) return { n: n, t: t };
  }
  return null;
}
const hm = h => h == null ? '—' : pad2(Math.floor(((h % 24) + 24) % 24)) + ':' + pad2(Math.round((h % 1) * 60) % 60);

let IANA_LIST = [];
try { IANA_LIST = (Intl.supportedValuesOf ? Intl.supportedValuesOf('timeZone') : []) || []; } catch(e){ IANA_LIST = []; }
const cityLabelFromTZ = tz => tz.split('/').pop().replace(/_/g, ' ');

function rank(c, n){
  const zh = norm(c.zh), en = norm(c.en), co = norm(c.country), st = norm(c.state);
  if (zh === n || en === n) return 0;
  if (zh.startsWith(n) || en.startsWith(n)) return 1;
  if (st === n) return 2;
  if (co.startsWith(n) || st.startsWith(n)) return 2;
  if (zh.includes(n) || en.includes(n)) return 3;
  if (co.includes(n) || st.includes(n) || norm(c.tz).includes(n)) return 4;
  return 99;
}
function suggestions(text){
  const q = String(text || '').trim();
  if (!q) return [];
  const n = norm(q);
  const scored = [];
  for (const c of DB){
    const r = rank(c, n);
    if (r < 99) scored.push({ c, r });
  }
  scored.sort((a, b) => a.r - b.r);
  const out = scored.slice(0, 10).map(x => x.c);
  const seenTZ = new Set(out.map(c => c.tz));
  for (const tz of IANA_LIST){
    if (out.length >= 10) break;
    if (seenTZ.has(tz)) continue;
    if (norm(tz).includes(n)){
      out.push({ zh: cityLabelFromTZ(tz), en: cityLabelFromTZ(tz), country: 'IANA 时区', tz, capital: false, key: tz + '|' + tz });
      seenTZ.add(tz);
    }
  }
  return out;
}
function addCity(item){
  if (!item) return;
  if (state.cities.some(c => c.key === item.key)){ toast('已在列表：' + item.zh); return; }
  const c = pushCity(item);
  save(); render(); schedulePush(); ensureCoord(c);
  toast('已添加 ' + (item.country ? item.country + ' ' : '') + item.zh);
}
function removeCity(id){
  const idx = state.cities.findIndex(c => c.id === id);
  if (idx < 0) return;
  const city = state.cities[idx];
  const name = city.zh;
  state.cities.splice(idx, 1);
  state.del.push({ key: city.key, t: Date.now() });
  save(); render(); schedulePush();
  toast('已移除 ' + name);
}

/* 缺经纬度时在线补一次，用于真实日出日落与礼拜时间 */
async function ensureCoord(city){
  if (!city || (city.lat != null && city.lon != null)) return;
  const q = city.en || city.zh;
  if (!q) return;
  try {
    const r = await fetch('https://geocoding-api.open-meteo.com/v1/search?name=' +
      encodeURIComponent(q) + '&count=1&format=json&language=zh');
    if (!r.ok) return;
    const j = await r.json();
    const it = j.results && j.results[0];
    if (!it) return;
    city.lat = it.latitude; city.lon = it.longitude;
    save(); render(); schedulePush();
  } catch(e){}
}
function commit(text){
  const q = String(text || '').trim();
  if (!q){ toast('先输入城市、国家或时区'); input.focus(); return; }
  const list = suggestions(q);

    input.value = ''; suggestBox.hidden = true; return;

  remoteSearch(q, true);
}

function importFromHash(){

/* =========================================================
   6. 渲染：白天区 / 夜间区，区内按 UTC 偏移
   ========================================================= */
function infoOf(c, now){
  const p = partsIn(c.tz, now);
  const off = offsetMin(c.tz, now);
  const hour = (+p.hour) + (+p.minute) / 60;
  let s = null;
  if (c.lat != null && c.lon != null) s = solarOf(now, +c.lat, +c.lon, off / 60);
  const isDay = (s && s.sunrise != null) ? (hour >= s.sunrise && hour < s.sunset)
                                        : (hour >= DAY_START && hour < NIGHT_START);
  const wd = new Date(Date.UTC(+p.year, +p.month - 1, +p.day)).getUTCDay();
  return { c, p, off, hour, s, isDay, wd,
           ws: workStateOf(c.country, hour, wd),
           pr: prayerAt(c.country, s, hour) };
}
function cardHTML(it, localDay, now){
  const c = it.c, p = it.p, t = timeParts(p);
  const d = dateInfoOf(p, localDay);
  const isLocal = c.tz === localTZ;
  const tag = it.pr ? '<span class="tag" title="' + esc(it.pr.n + ' ' + hm(it.pr.t)) + ' 前后不打扰">🕌</span>' : '';
  return '<article class="card' + (isLocal ? ' me' : '') + '" data-id="' + c.id + '">' +
      '<span class="st ' + it.ws.k + '" title="' + esc(it.ws.t) + '"></span>' +
      '<button class="x" type="button" data-del="' + c.id + '" aria-label="移除 ' + esc(c.zh) + '">×</button>' +
      '<div class="place">' +
        '<span class="country">' + esc(c.country) + '</span>' +
        '<span class="city">' + esc(c.zh) + '</span>' +
      '</div>' +
      '<div class="row">' +
        '<span class="time"><span data-f="hm">' + t.hm + '</span>' +
          '<span class="sec" data-f="sec">' + t.sec + '</span>' +
          '<span class="ampm" data-f="ampm">' + t.ampm + '</span></span>' +
        '<span class="date' + (d.delta !== 0 ? ' shift' : '') + '" data-f="date">' + tag + d.text + '</span>' +
      '</div>' +
    '</article>';
}
function zoneHTML(kind, items, localDay, now){
  const head = kind === 'day'
    ? '<span class="name">☀ 白天</span><span class="hours">已日出</span>'
    : '<span class="name">☾ 夜间</span><span class="hours">已日落</span>';
  let html = '<section class="zone ' + kind + '"><div class="zone-head">' + head +
    '<span class="count">' + items.length + '</span></div><div class="grid">';
  for (const it of items){
    html += cardHTML(it, localDay, now);
    lastOffsets[it.c.id] = it.off;
    lastDayFlags[it.c.id] = it.isDay;
    lastPray[it.c.id] = !!it.pr;
  }
  return html + '</div></section>';
}
function render(){
  const now = new Date();
  const localDay = dayNumberLocal(now);
  nodes = {}; lastOffsets = {}; lastDayFlags = {}; lastPray = {};

  if (!state.cities.length){
    board.innerHTML = '<div class="empty">还没有地区，输入城市回车加入。<br>按当地真实日出日落分白天 / 夜间两区。</div>';
    return;
  }
  const items = state.cities.map((c, idx) => {
    const it = infoOf(c, now);
    it.idx = idx;
    return it;
  });
  items.sort((a, b) => state.desc ? (b.off - a.off || a.idx - b.idx) : (a.off - b.off || a.idx - b.idx));

  const dayItems = items.filter(i => i.isDay);
  const nightItems = items.filter(i => !i.isDay);

  let html = '';
  if (dayItems.length) html += zoneHTML('day', dayItems, localDay, now);
  if (nightItems.length) html += zoneHTML('night', nightItems, localDay, now);
  board.innerHTML = html;

  for (const c of state.cities){
    const el = board.querySelector('[data-id="' + c.id + '"]');
    if (!el) continue;
    nodes[c.id] = {
      hm: el.querySelector('[data-f="hm"]'),
      sec: el.querySelector('[data-f="sec"]'),
      ampm: el.querySelector('[data-f="ampm"]'),
      date: el.querySelector('[data-f="date"]')
    };
  }
  updateBanner(items);
}
function updateBanner(items){
  if (!banner) return;
  const prs = items.filter(i => i.pr);
  if (!prs.length){ banner.hidden = true; banner.innerHTML = ''; return; }
  banner.hidden = false;
  banner.innerHTML = '<b>🕌 礼拜时段</b><span class="dot">·</span>' +
    prs.map(i => esc(i.c.zh) + ' ' + esc(i.pr.n) + ' ' + hm(i.pr.t)).join('，') +
    '<span class="dot">·</span>此时不打电话';
}
function dayNumberLocal(now){
  const p = partsIn(localTZ, now);
  return dayOfParts(p);
}

/* =========================================================
   7. 每秒刷新
   ========================================================= */
function tick(){
  const now = new Date();
  const localOff = offsetMin(localTZ, now);
  const localDay = dayNumberLocal(now);
  const hp = partsIn(HEAD_TZ, now);
  const hOff = offsetMin(HEAD_TZ, now);
  const ht = timeParts(hp);
  nowTime.textContent = ht.hm + ht.sec + (ht.ampm ? ' ' + ht.ampm : '');
  const offTxt = (hOff < 0 ? 'UTC-' : 'UTC+') +
    String(Math.floor(Math.abs(hOff) / 60)).padStart(2, '0') + ':' +
    String(Math.abs(hOff) % 60).padStart(2, '0');
  nowMeta.textContent = '北京 · ' + (+hp.month) + '/' + (+hp.day) + ' · ' + offTxt + (cloudAgo ? ' · ' + cloudAgo : '');
  nowMeta.title = HEAD_TZ + ' · ' + offTxt;

  let dirty = false;
  for (const c of state.cities){
    const it = infoOf(c, now);
    const p = it.p;
    if (it.off !== lastOffsets[c.id] || it.isDay !== lastDayFlags[c.id] || !!it.pr !== !!lastPray[c.id]) dirty = true;

    const n = nodes[c.id];
    if (!n) continue;
    const t = timeParts(p);
    n.hm.textContent = t.hm;
    n.sec.textContent = t.sec;
    n.ampm.textContent = t.ampm;
    const d = dateInfoOf(p, localDay);
    n.date.textContent = (it.pr ? '🕌 ' : '') + d.text;
    n.date.classList.toggle('shift', d.delta !== 0);
  }
  if (dirty) render();
}
function loop(){
  tick();
  const ms = 1000 - new Date().getMilliseconds();
  setTimeout(loop, ms > 0 ? ms : 1000);
}

/* =========================================================
   8. 控件
   ========================================================= */
function syncTools(){
  btnHour.textContent = state.hour12 ? '12 时制' : '24 时制';
  btnHour.setAttribute('aria-pressed', state.hour12 ? 'true' : 'false');
  btnSec.setAttribute('aria-pressed', state.showSec ? 'true' : 'false');
}
input.addEventListener('input', () => renderSuggest(input.value));
input.addEventListener('focus', () => { if (input.value.trim()) renderSuggest(input.value); });
input.addEventListener('blur', () => setTimeout(() => { suggestBox.hidden = true; }, 120));
input.addEventListener('keydown', e => {
  if (e.key === 'Enter'){ e.preventDefault(); commit(input.value); }
  else if (e.key === 'Escape'){ suggestBox.hidden = true; }
});
addBtn.addEventListener('click', () => commit(input.value));
suggestBox.addEventListener('mousedown', e => {
  const b = e.target.closest('.sug');
  if (!b) return;
  e.preventDefault();
  if (b.dataset.net){ remoteSearch(input.value, false); return; }
  if (b.dataset.r != null){
    const rc = remoteList[+b.dataset.r];
    if (rc){ addCity(rc); input.value = ''; input.focus(); suggestBox.hidden = true; }
    return;
  }
  const si = suggestList[+b.dataset.i];
  if (!si) return;
  addCity(si);
  input.value = ''; input.focus(); suggestBox.hidden = true;
});
board.addEventListener('click', e => {
  const b = e.target.closest('[data-del]');
  if (!b) return;
  removeCity(+b.dataset.del);
});
btnHour.addEventListener('click', () => { state.hour12 = !state.hour12; save(); syncTools(); render(); });
btnSec.addEventListener('click', () => { state.showSec = !state.showSec; save(); syncTools(); render(); });
btnShare.addEventListener('click', copyShare);

/* =========================================================
   9. 启动
   ========================================================= */
(function init(){
  const restored = load();
  const imported = importFromHash();
  const fresh = !restored && !imported;
  if (fresh){
    ['Asia/Shanghai|深圳', 'Europe/London|伦敦', 'Asia/Dubai|迪拜', 'America/New_York|纽约', 'America/Sao_Paulo|圣保罗', 'Australia/Sydney|悉尼']
      .forEach(k => { const c = DB.find(x => x.key === k); if (c) pushCity(c); });
    save();
  } else if (imported){
    save();
    setTimeout(() => toast('已载入分享的 ' + imported + ' 个地区'), 700);
  }
  syncTools();
  render();
  loop();
  syncCloud(fresh);
})();

/* 打开页面时把仓库里那份列表拉下来，缺的补上，多的推回去 */
async function syncCloud(fresh){
  cloudAgo = '同步中';
  const remote = await cloudPull();
  if (remote && remote.length){
    if (fresh){ state.cities = []; state.seq = 1; }
    let added = 0;
    for (const rc of remote){
      if (!rc || !rc.tz || !isValidTZ(rc.tz)) continue;
      if (isDel(rc.key)) continue;
      if (state.cities.some(c => c.key === rc.key)) continue;
      state.cities.push({ id: state.seq++, zh: rc.zh || rc.tz, en: rc.en || '',
        country: rc.country || '', tz: rc.tz, capital: !!rc.capital,
        state: rc.state || '', key: rc.key, lat: rc.lat, lon: rc.lon });
      added++;
    }
    const differs = state.cities.length !== remote.filter(r => r && r.key && !isDel(r.key)).length;
    save(); render();
    if (added || differs){ cloudAgo = '同步中'; schedulePush(); }
    else { cloudAgo = '已同步'; }
    state.cities.filter(c => c.lat == null || c.lon == null).slice(0, 12).forEach(c => ensureCoord(c));
  } else {
    schedulePush();
  }
}
